# HEADING OS engine CI (F-1.2) - proves what the README claims.
#
# Jobs: guards (identity of the project) -> lint -> security-tests -> unit-tests,
# plus sbom on pushes. Every action is pinned by commit SHA (F-1.5).
#
# Since the 2026-09-21 test-suite split (HOS-54) the unit-tests job runs the gate
# tests under tests/, which is what the repository holds; the parked suites are
# not run anywhere, and no step here claims otherwise. Every `uv sync` uses
# `--dev --all-extras --frozen` so a gate test never skips for a missing extra.
# The required checks on `main` are `sovereignty guards`, `security suite (the
# money badge)` and `ruff + bandit`, by those job NAMES: renaming one of those
# jobs leaves the required check waiting for a name nothing reports.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the session TZ the test suite pins in tests/conftest.py: Etc/GMT-4 is
  # a fixed offset four hours east of UTC with no DST (not a location signal). The
  # tz-sensitive calendar and pulse tests asserted +4 local-time math, and a bare
  # UTC here overrode the conftest default and failed them. Those tests went out
  # with the 2026-09-21 split, so nothing in CI would notice this line changing
  # today. The conftest pin is still there and this still has to agree with it.
  HEADING_OS_TZ: Etc/GMT-4
  # Two steps redirect `uv export` STRAIGHT INTO A DATA FILE -- the
  # requirements-in-sync diff and the CycloneDX SBOM. MEASURED 2026-09-10 on the
  # workstation, where Claude Code exports `FORCE_COLOR=3`: uv honoured it
  # through a captured (non-tty) stream and wrote `\x1b[32m# This file was
  # autogenerated...` as line 1, which made the file unparseable and took the CVE
  # audit down with an error naming the wrong thing. GitHub's runners do not set
  # `FORCE_COLOR` today, so those two steps are latent rather than broken; this
  # says so out loud instead of depending on a runner default nobody controls.
  NO_COLOR: "1"

jobs:
  guards:
    name: sovereignty guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because this is the job that runs the Canopus
          # clauses, and three of the four reach commits that depth 1 does not
          # fetch. Each note names an `approval_sha`: C1 diffs the contract
          # between that commit and the end state, C2 asks `git merge-base
          # --is-ancestor` whether the implementation descends from it, and C3
          # checks the contract out THERE in a worktree and runs it. The
          # `--range` scoping adds a `git rev-list`. checkout defaults to depth
          # 1, where every one of those objects is absent: the clause either
          # errors on an unknown object or finds one commit and passes
          # vacuously, which is worse - a green check that measured nothing.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true   # v9 flipped this default to false
      # `id`, because every guard step below is conditioned on this one having
      # SUCCEEDED. `!cancelled()` on its own would run twenty guards against a
      # half-installed environment and report twenty failures for one cause.
      - id: deps
        run: uv sync --dev --all-extras --frozen
      # WHY EVERY STEP FROM HERE CARRIES `if: ${{ !cancelled() && ... }}`.
      # A step's default condition is `success()`, so ONE red step skips every
      # step after it, and the skipped ones here are the ratchets,
      # detect-secrets, the vendored-skill hashes and the documentation drift
      # check. MEASURED 2026-09-21 on run 35538942145 (job 106152936146, pushed
      # 2026-09-20): the Canopus step at position 10 exited 1 and steps 11
      # through 25 all reported `skipped`, so a red run did not say what it had
      # failed to check - fifteen guards, silent.
      #
      # `!cancelled()` and NOT `continue-on-error: true`, deliberately. The
      # latter marks a failed step as successful and the JOB goes green, which
      # would trade a loud incomplete run for a quiet false one. With
      # `!cancelled()` each step still fails the job on its own exit code; all
      # that changes is that a predecessor's failure no longer suppresses it.
      # A step added later WITHOUT this condition simply reverts to today's
      # behaviour, which is the safe direction for a forgotten marker.
      - name: Leak guard (no hardcoded data paths in engine code)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # `-z` plus `xargs -0`, the shape the rest of this repo reads git paths
        # with. Plain `git ls-files | xargs` word-splits on whitespace, so a
        # path holding a space names two files that do not exist, and git
        # C-quotes a path holding a non-ASCII or control byte so `xargs` strips
        # the quotes and hands over an escaped string. Either way the file is
        # SILENTLY skipped and the step still passes: a green leak guard over a
        # file it never opened. Measured 2026-08-30 alongside the CR-translation
        # sweep.
        run: git ls-files -z '*.py' '*.sh' | xargs -0 uv run python scripts/leak-guard.py check-paths --files
      - name: Engine tree clean (no data-class artifact in the engine clone)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run python -m pytest tests/test_engine_tree_clean.py tests/test_data_root_no_bypass.py -q
      - name: Skill router registry generated + in sync (F-5.1)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run python scripts/generate-skill-router.py --check
      - name: Documentation style (ASD-STE100 subset, errors only)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Errors only, on purpose. The mechanical checks (sentence length, one
        # action per step, banned padding vocabulary) sit at zero across the
        # in-scope set; the warnings are heuristics with no part-of-speech tagger
        # behind them, so --strict would gate on guesses.
        run: uv run python scripts/ste-check.py --all --quiet
      - name: Documentation style - skill bodies (ASD-STE100 subset, errors only)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # The other half of the rule's scope, armed 2026-08-17. Until then `--all`
        # covered twelve pages and the ninety-six skill bodies went unmeasured, so
        # a green `--all` read as a green corpus. No vendored exemption: the one
        # vendored skill was adapted and re-locked, because an exemption hides a
        # file's debt permanently.
        run: uv run python scripts/ste-check.py --skills --quiet
      - name: Canopus record check (reports, does not block a direct push)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # The name is the honest limit, and it is not modesty. `enforce_admins`
        # is false on the only push path in use, so a required check cannot
        # actually stop a direct push to main; any sentence giving this step a
        # verb of refusal would be an overclaim. It REPORTS: a red step here is
        # a loud, dated, permanent record that a slice's note stopped matching
        # the repository, seen by whoever reads the run.
        #
        # The exit code is deliberately NOT swallowed with `|| true`. A step
        # that can never be observed failing is the exact defect this whole
        # design exists to remove -- exit 0 would then mean "nothing was
        # observed", not "the clauses held".
        #
        # This calls `scripts/canopus_check.py` and not `scripts/canopus.py check`:
        # the subcommand is a passthrough to the same `main`, but importing it
        # would pull in modules a clause run never touches.
        run: uv run python scripts/canopus_check.py
      - name: Rule split inventory drift guard (D4)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # No-op until a rule split/compression writes a snapshot under
        # config/rule-split-inventory/; then it fails the build if a later edit drops a
        # snapshotted directive from a compressed or split always-on rule file.
        run: uv run python scripts/rule_split_check.py --check
      - name: Skill metadata contract
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run python scripts/skill-metadata-check.py
      - name: Version sync (F-1.1)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run python scripts/check-version-sync.py --quiet
      - name: detect-secrets baseline drift (F-9.4)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # `scan --baseline` REWRITES the baseline in place and exits 0 whatever
        # it finds, so this step was named for a drift it could not detect: a
        # new secret updated the file and the job stayed green.
        #
        # `git diff --exit-code` is NOT the fix and was tried first. MEASURED
        # 2026-09-05: two consecutive scans of an unchanged tree differ, because
        # `generated_at` is stamped on every run. That gate would have failed
        # every build forever, which is a gate nobody keeps.
        #
        # So the comparison is over `results` alone, and the scan writes to a
        # COPY: a step that rewrites a tracked file leaves the checkout dirty
        # for everything after it. `results` is the right key to compare because
        # the baseline's self-reference lives in `filters_used`, which changes
        # with the copy's path and would otherwise differ on every run.
        #
        # Both halves MEASURED 2026-09-05 against the refreshed baseline: an
        # unchanged tree passes, and a 64-hex literal planted in a new file
        # fails with that file named. The planted file had to be `git add -N`'d
        # first, because detect-secrets walks the git index and an UNTRACKED
        # file is invisible to it. That costs nothing here (a checkout tracks
        # everything) but it is why this gate is not the one that catches a
        # secret in a scratch file; the push wall's content scan is.
        run: |
          cp .secrets.baseline "$RUNNER_TEMP/baseline.new"
          uv run detect-secrets scan --baseline "$RUNNER_TEMP/baseline.new"
          uv run python -c '
          import json, os, sys
          old = json.load(open(".secrets.baseline"))["results"]
          new = json.load(open(os.environ["RUNNER_TEMP"] + "/baseline.new"))["results"]
          if old == new:
              sys.exit(0)
          added = {f: new[f] for f in new if f not in old or new[f] != old[f]}
          gone = [f for f in old if f not in new]
          print("detect-secrets baseline is out of date.")
          for f in sorted(added):
              print(f"  new or changed findings in {f}")
          for f in sorted(gone):
              print(f"  findings gone from {f}")
          print("Review each, then refresh with:")
          print("  detect-secrets scan --baseline .secrets.baseline")
          sys.exit(1)
          '
      - name: Skill bash-path audit (F-9.3)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # `--check`, without which the script only prints and exits 0 on any
        # regression, so the step could not fail. Added 2026-09-28 (HOS-162).
        run: uv run python scripts/audit-skill-bash-paths.py --check
      - name: Prose path-reference audit
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run python scripts/check-path-references.py --check
      - name: Data-path ratchet (HOS-5; no NEW unresolvable overlay paths)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # `--skip-without-overlay` is what makes this runnable here at all: the
        # runner has no private overlay, and without the flag the scanner exits
        # 2 by design ("nothing to say on a public clone"). With it, CI holds
        # the shape of the gate and HELM's push path holds the measurement.
        # The ratchet and the prohibition in one invocation: the scan is the
        # expensive part and it is the same scan. `--pins-check` is HOS-5
        # section 6: no statement in engine Python spells a Data Repository
        # address unless config/data-path-pins-exemptions.json carries it, with
        # a reason, and no entry there is stale.
        run: uv run python scripts/check-data-path-references.py --ratchet --pins-check --skip-without-overlay
      - name: Test-vacuity ratchet
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run python scripts/check-test-vacuity.py --check
      - name: live_data_root ratchet (no new escape from the data-root pin)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Reads the test SOURCE, so it answers the same on a runner with no
        # private overlay as it does in HELM. That is the point of moving the
        # control off a child-process count, which could only be measured on a
        # machine that had the overlay to be reachable in the first place.
        run: uv run python scripts/check-live-data-root.py --check
      - name: Home-path guard (HOS-35; no real home directory in the public engine)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Reads git's INDEX and the files' literal TEXT, so it answers the same
        # on a runner with no private overlay as it does in HELM. MEASURED
        # 2026-09-21 before the repair: 27 findings in 13 files.
        run: uv run python scripts/check-home-paths.py --check
      - name: Gate-integrity ratchet
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run python scripts/check-gate-integrity.py --check
      - name: Classification health (F-9.3)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run python scripts/classification-health.py
      - name: requirements.txt in sync with the lock (F-7.1)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Byte-identical to the regen command; uv writes a header echoing this
        # exact argv, so any drift (or a hand-edited header) fails the diff.
        run: |
          uv export --no-hashes --no-dev --all-extras --no-emit-project --format requirements-txt > /tmp/req.txt
          diff -u requirements.txt /tmp/req.txt
      - name: README numbers in sync (F-8.3)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Fails if README.md and SECURITY.md disagree on the enforcement-layer
        # count. The authority they are held against, the segregation contract,
        # left the engine on 2026-09-25, so on this runner the guard checks the
        # two front doors against each other and says so.
        run: uv run python scripts/dev/check-readme-numbers.py

  lint:
    name: ruff + bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true   # v9 flipped this default to false
      - run: uv sync --dev --all-extras --frozen
      - name: ruff - blocking security subset (mirror of the pre-commit gate)
        run: uv run ruff check . --select S --ignore S101,S105,S310,S603,S607
      - name: ruff - full-ruleset ratchet (F-3.2, fails on NEW lint debt)
        run: uv run python scripts/lint-ratchet.py check
      # `.claude/skills` is the third root (2026-08-31): the Python that ships
      # inside skills sat outside the other two, so CI scanned none of it.
      - name: bandit
        run: uv run bandit -c pyproject.toml -r scripts .claude/hooks .claude/skills -q --severity-level medium --confidence-level medium

  security-tests:
    name: security suite (the money badge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true   # v9 flipped this default to false
      - run: uv sync --dev --all-extras --frozen
      # PARKED 2026-09-21 (HOS-54): the 559-case security suite this step ran is
      # not in this repository, so the step now drives the adversarial
      # prompt-injection corpus under tests/security/prompt-injection/ instead.
      #
      # What this step does NOT do, in its name: `--dry-run` loads and validates
      # the eight attack fixtures and scores nothing, because no model is called.
      # Every fixture demands a literal token, so a live run can score all eight.
      # The job keeps its name because branch protection
      # requires it by that name; the step says what it is.
      - name: Adversarial fixtures validated (dry run; no model call, nothing scored)
        run: uv run python tests/security/prompt-injection/run-adversarial-suite.py --dry-run --quiet

  unit-tests:
    name: unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: tests/test_data_root_no_bypass.py reads six pre-fix
          # blobs by id (`git cat-file -p`) that HEAD's tree does not hold. At
          # depth 1 one of those tests fails and five skip their failing half
          # (checked 2026-10-16, engine audit F-7.D23).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true   # v9 flipped this default to false
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --dev --all-extras --frozen --python ${{ matrix.python }}
      # Setup steps 3 and 5 of CLAUDE.md, the ones every fresh clone runs.
      # tests/test_gates_are_armed.py asserts that THIS checkout has its commit
      # gate installed and its session hooks registered, and
      # tests/test_gate_detect_private_key.py drives the INSTALLED copy of that
      # gate. A runner checkout had neither, so since both files arrived on
      # 2026-09-21 (HOS-54) their three cases failed on every push for a reason
      # that had nothing to do with the code: the clone skipped setup. The
      # tests are right to be red on such a clone and stay unchanged; the runner
      # now arms itself the way an operator's clone does. `--install-hooks`
      # fetches every hook environment the config declares, detect-private-key's
      # among them. setup-platform.sh writes only the gitignored
      # .claude/settings.local.json.
      - name: arm the commit gate and the session hooks, as a fresh clone does
        run: |
          uv run --no-sync --python ${{ matrix.python }} pre-commit install --install-hooks
          bash scripts/setup-platform.sh
      - name: gate tests (integration/acceptance markers excluded)
        # Coverage is REPORTED here and no floor is enforced; the paragraph under
        # this step says why. A floor set again belongs on this step, against a
        # fresh measurement.
        #
        # -n auto: pytest-xdist, already a dev dependency.
        #
        # `--no-sync --python ${{ matrix.python }}`, because a bare `uv run`
        # re-resolves the interpreter from `.python-version` (3.11) and re-syncs
        # the default set, so the 3.12 leg would test 3.11 without the extras
        # (MEASURED 2026-09-21).
        run: >
          uv run --no-sync --python ${{ matrix.python }}
          pytest tests/ -q -p no:cacheprovider -n auto
          -m "not integration and not acceptance"
          --cov=scripts --cov-report=term
        # THE FLOOR IS REMOVED, NOT LOWERED, AND THAT IS THE HONEST OPTION.
        # `--cov-fail-under=35` was set against a measured 43% produced by a
        # 29,254-case suite. That suite was parked on 2026-09-21 (HOS-54) and what
        # remains is the gate tests alone, so any number here would be a floor under
        # a corpus deliberately reduced to the protection surface: it would measure
        # how much of scripts/ the gate tests happen to import, which is not a
        # quality anybody is defending. Lowering it to whatever passes today would
        # keep the APPEARANCE of a gate while gating nothing, which is the exact
        # shape this repository's own rules call a defect. Coverage is still
        # REPORTED, so the number is visible on every run, and the day it means
        # something again a floor can be set against a fresh measurement.

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    # Build the SBOM on real refs (main + tags), not on every PR.
    if: github.event_name == 'push'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true   # v9 flipped this default to false
          # Pin uv so the experimental cyclonedx export format cannot shift silently.
          version: "0.11.21"
      - name: Generate CycloneDX SBOM (F-9.6)
        # `--format cyclonedx1.5` is experimental and writes to stdout (the -o flag
        # yields no file), so redirect. The preview flag stabilizes step success.
        run: uv export --format cyclonedx1.5 --preview-features sbom-export > sbom.cdx.json
      - name: Guard non-empty SBOM
        run: test -s sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
