# Continuous CVE watch for the full locked dependency graph.
#
# This is the layer that catches a CVE disclosed against an ALREADY-pinned,
# unchanged dependency -- the common case, where the package didn't move, the
# world's knowledge of it did. The pre-commit hook only fires when a dependency
# file changes; Dependabot only opens PRs once the repo is public (or with GHAS).
# This scheduled job bridges both gaps and runs today on the private repo.
#
# It reuses the single auditing primitive (scripts/audit-deps.py), so the gate
# is identical at commit time and in CI: the FULL locked graph (dev + transitive),
# not just the --no-dev requirements.txt.
name: dependency-audit

on:
  schedule:
    # Daily at 05:30 UTC -- fast disclosure-to-detection without waiting on a dep bump.
    - cron: "30 5 * * *"
  push:
    branches: [main]
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "scripts/audit-deps.py"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-dev.txt"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true   # v9 flipped this default to false

      - name: Sync dev dependencies (installs pip-audit + the full lock incl extras)
        run: uv sync --dev --all-extras --frozen

      # A data root the RUNNER owns, never the private one. Since 2026-09-25 the
      # audit writes its temporary requirements file under `runtime:scratch/tmp`
      # and refuses without a writable data root, by design, and this runner has
      # no data repository (MEASURED 2026-09-26, 58aa1db3). The synthetic root is
      # the engine's own throwaway data tree (scripts/utils/synthetic_data_root.py),
      # built in $RUNNER_TEMP and gone with the job.
      - name: Build a throwaway synthetic data root for this job
        run: |
          root="$(uv run python scripts/data-path.py synthetic "$RUNNER_TEMP/synthetic-data")"
          echo "HEADING_OS_DATA=$root" >> "$GITHUB_ENV"

      - name: Audit full locked dependency graph for CVEs
        run: uv run python scripts/audit-deps.py
