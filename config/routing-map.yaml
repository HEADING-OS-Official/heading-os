# HEADING OS routing map: what belongs to THIS repository.
#
# One of the two classification inputs, with `config/engine-allowlist.yaml`.
# `get_routing_destination()` in `scripts/utils/workspace.py` reads these and
# nothing else; never write a second prefix list beside them (MEASURED
# 2026-09-13: a hand-written one disagreed with this map on 10,008 of 11,857
# files, always unsafely).
#
# The default is `private` and what follows is an ALLOWLIST of public engine
# files (inverted 2026-09-21, so a list of private exceptions can no longer
# disclose what the operator tracks). `config/`, `docs/` and `reference/` are
# allowlisted file by file: a new engine file there resolves `private` and the
# commit gate refuses it until its name is added here. Every data-repository
# path is private by repository (HOS-232); an engine path answers `engine` only
# when the allowlist covers it AND this map routes it `engine`, otherwise it is
# refused. Two destinations only, `engine` and `private` (`corporate` retired,
# HOS-132).
#
# Resolution: most-specific (longest) matching key wins. A key ending in '/'
# matches as a directory prefix; a key without one matches that exact path or
# that path as a prefix. An unparseable file resolves every path to `private`.

version: 1

# An engine path no rule below names is REFUSED (HOS-232), and the commit gate
# refuses it with the resolver. That is the point. Do not change it to `engine` to make a commit pass.
default: private

# Every data-repository path is private, rule or none (HOS-232). Operator
# ruling 2026-09-13: not one file of the Data Repository may be open.
data_default: private

rules:
