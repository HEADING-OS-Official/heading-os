  "docs/SKILLS-INTEL.md": engine
  "docs/SKILLS-STRATEGY.md": engine
  "docs/SKILLS-SYSTEM.md": engine
  "docs/SKILLS.md": engine
  "docs/WHATS-NEW.md": engine
  "docs/WORKING-WITH-HEADING-OS.md": engine
  "docs/YARDS.md": engine
  "docs/assets/how-it-works.svg": engine
  "docs/assets/install-steps.svg": engine
  "docs/assets/security.svg": engine
  "install.sh": engine

  # ---- allowlist: whole directories of engine code ---------------------------
  ".claude/": engine
  ".devcontainer/": engine
  ".githooks/": engine
  ".github/": engine
  # The HEADING OS Official overlay: what scripts/official-build.py lays over the
  # published snapshot. Each file is listed in config/engine-allowlist.yaml.
  "scripts/": engine
  "tests/": engine

  # ---- allowlist: root files -------------------------------------------------
  ".env.example": engine
  ".gitattributes": engine
  ".gitignore": engine
  ".lint-baseline.json": engine
  ".pre-commit-config.yaml": engine
  ".python-version": engine
