  "pyproject.toml": engine
  "requirements-dev.txt": engine
  "requirements.txt": engine
  "uv.lock": engine

  # ---- private exceptions inside an allowlisted directory --------------------
  # Runtime and per-instance files the allowlist above would otherwise open.
  ".claude/settings.local.json": private
  ".claude/projects/": private
  "scripts/sentinel_config.yaml": private

