# Setup wizard question bank (authoritative)
# Schema: see the 2026-04-24 setup-wizard design spec, §4 (registry name `spec-docs`)
# IDs are immutable once shipped. Adding questions is safe; removing is not.
# Removals so far: the three executive-only questions and every executive
# output target, 2026-09-25, with the executive workspace model; and
# company_timezone and anthropic_api_key, 2026-11-03 (HOS-312), because the
# installer's intake owns the time zone and the wizard never asks for a key.

# ──────────────────────────────────────────────────────────────
# Public audience (pristine HEADING OS clones)
# ──────────────────────────────────────────────────────────────

- id: company_full_name
  audience: [public]
  type: placeholder
  required: true
  prompt: "What's your company's full legal name?"
  example: ""
  target:
    placeholder: "{COMPANY_FULL}"
    files: ["business-info"]

- id: company_short_name
  audience: [public]
  type: placeholder
  required: true
  prompt: "Your company's short name (one or two words you use in conversation)."
  example: ""
  target:
    placeholder: "{COMPANY}"
    files: ["business-info"]

- id: company_domain
  audience: [public]
  type: placeholder
  required: true
  prompt: "Your company's email/web domain."
  example: ""
  target:
    placeholder: "{COMPANY_DOMAIN}"
    files: ["business-info"]

- id: company_hq_cities
  audience: [public]
  type: list
  required: false
  prompt: "Cities where your company has significant presence (1-3, comma-separated)."
  example: ""
  target:
    placeholder: "{HQ_CITIES}"
    files: ["business-info"]

- id: ceo_full_name
  audience: [public]
  type: placeholder
  required: true
  prompt: "Your full name (the person using this workspace)."
  example: ""
  target:
