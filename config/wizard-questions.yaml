    files: ["personal-info"]

- id: product_name
  audience: [public]
  type: placeholder
  required: true
  prompt: "Your flagship product or platform name."
  example: ""
  target:
    placeholder: "{PRODUCT}"
    files: ["business-info"]

- id: product_tagline
  audience: [public]
  type: placeholder
  required: false
  prompt: "Your product tagline (short, memorable)."
  example: ""
  target:
    placeholder: "{PRODUCT_TAGLINE}"
    files: ["business-info"]

- id: product_modules
  audience: [public]
  type: list
  required: false
  prompt: "Your product's main modules or product lines (up to 4, comma-separated)."
  example: ""
  target:
    placeholder: "{PRODUCT_MODULES}"
    files: ["business-info"]

- id: team_name
  audience: [public]
  type: placeholder
  required: true
