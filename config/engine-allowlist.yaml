# What the engine repository may carry. Everything else is a leak.
#
# Operator decision 2026-09-25 (HOS-131), his words, translated: "any information in the
# engine that is not the engine itself (scripts, hooks, plugins, skills) counts as
# a leak and must NOT be in it!" The definition he accepted the same day, proposed
# by HELM, translated: "the engine is code and what that code cannot run or
# install without; everything else is a leak". The classes below are HELM's recommendations, which he
# accepted; the per-file entries are a yard's reading of each file, written with
# the reason so a reviewer can refuse one.
#
# Read by scripts/check-engine-only.py, at pre-commit and as the sixth push
# ratchet. A tracked file is engine when a class pattern or a per-file entry
# below covers it. A file covered by neither is refused unless it is listed in
# config/engine-only-baseline.json, the migration list that may only shrink.
#
# Patterns: `*` never crosses a slash, `**/` is zero or more directories, `?` is
# one character. A pattern or entry that matches nothing refuses as stale, and
# anything here that also matches the checker's NEVER list (examples/, records/,
# docs/ beyond the install guide, images, office files, brand folders) refuses:
# a content class cannot be allowlisted from this file, only by changing the
# checker, which is code a reviewer reads.

classes:
  - class: engine-code
    reason: the engine's executable code, which is what the engine is
    patterns:
      - "scripts/**/*.py"
      - "scripts/**/*.sh"
      - ".claude/hooks/*.py"
      - ".claude/skills/**/*.py"
      - ".githooks/*"

  - class: engine-instruction
    reason: instructions the harness loads and executes as behaviour; a skill, a rule and an agent definition are the engine for an LLM runtime
    patterns:
      - ".claude/skills/*/SKILL.md"
      - ".claude/skills/*/triggers.json"
      - ".claude/rules/*.md"
      - ".claude/commands/*.md"
      - ".claude/agents/*.md"

  - class: engine-tests
    reason: test code; its data is generated at run time, so only code is covered here
    patterns:
      - "tests/**/*.py"

  - class: install-and-ci
    reason: what installs, locks, wires and checks the engine
    patterns:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".python-version"
      - ".pre-commit-config.yaml"
      - ".gitignore"
      - ".gitattributes"
      - ".github/**/*.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".devcontainer/devcontainer.json"
      - "scripts/templates/systemd/*.service"
      - "scripts/templates/systemd/*.timer"
      - ".claude/settings.json"
      - ".claude/settings.local.*.json"

  - class: the-four-documents
    reason: the operator's list of the documents that stay, README, LICENSE, SECURITY and the install guide; which docs/ page is the install guide is a yard's proposal (docs/DEPLOYMENT.md, "the complete, zero-to-running guide") awaiting his word
    patterns:
      - "README.md"
      - "LICENSE"
      - "SECURITY.md"

# Files a pattern cannot decide. Each names what in the engine reads it or which
# rule or skill loads it as procedure, as found by the HOS-131 inventory on
# 2026-09-25 (git grep per file; the rows are in the data repository beside the
# inventory). A reviewer refuses an entry by deleting it; the file then refuses
# until it leaves or is re-argued.
