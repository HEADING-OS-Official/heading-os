  gh:
    # A release binary in ~/bin with no updater of its own here.
    tier: observed
    display: GitHub CLI
    telemetry:
      kind: switch
      probe: |-
        /usr/bin/python3 -I - <<'PY'
        import json, os, subprocess
        from pathlib import Path
        import yaml
        def systemd_env():
            out = subprocess.run(["/usr/bin/systemctl", "--user", "show-environment"],
                                 capture_output=True, text=True, timeout=10, check=True).stdout
            return dict(line.split("=", 1) for line in out.splitlines() if "=" in line)
        def settings_env(path):
            try:
                with open(path, encoding="utf-8") as fh:
                    env = json.load(fh).get("env")
            except FileNotFoundError:
                return {}
            if env is not None and not isinstance(env, dict):
                raise SystemExit(f"{path}: env is not a mapping")
            return env or {}
        def sources():
            caller = dict(os.environ)
            return {"caller": caller, "timer": systemd_env(),
                    "claude-settings": {**caller, **settings_env(Path.home() / ".claude/settings.json")}}
        with open(Path.home() / ".config/gh/config.yml", encoding="utf-8") as fh:
            doc = yaml.safe_load(fh) or {}
        if not isinstance(doc, dict):
            raise SystemExit("config.yml is not a mapping")
        value = doc.get("telemetry")
        bad = [] if str(value).strip().lower() == "disabled" else [f"config telemetry={value!r}"]
        for name, env in sources().items():
            if "GH_TELEMETRY" in env and env["GH_TELEMETRY"].strip().lower() not in ("disabled", "false", "0", "off"):
                bad.append(f"{name} GH_TELEMETRY={env['GH_TELEMETRY']!r}")
        print("effective=on: " + ", ".join(bad) if bad else "effective=off")
        PY
      "off": "^effective=off$"
      evidence: "Strings of ~/bin/gh 2.105.0 read 2026-11-23: 'Send telemetry event to GitHub', config key telemetry ('whether telemetry is enabled, disabled, or logging'), GH_TELEMETRY. The probe parses config.yml as YAML and needs telemetry: disabled, and refuses any GH_TELEMETRY in the caller's, the timers' or the Claude settings environment that is not a disabling value. DO_NOT_TRACK=1 is in the environment, but no document read here says gh honours it."
    current:
      via: shell
      cmd: "$HOME/bin/gh --version"
      regex: 'gh version (\S+)'
    latest:
      via: github_release
      repo: cli/cli

