      evidence: "sweep report 2026-11-22-1720_no-telemetry-sweep (registry name deliverables), sweep-findings.md section 2, and codegraph's dist/telemetry/index.d.ts and README line 789 (read 2026-11-23): usage telemetry to telemetry.getcodegraph.com, decided in the order DO_NOT_TRACK, CODEGRAPH_TELEMETRY, ~/.codegraph/telemetry.json, default. The probe applies that order to the caller's, the timers' and the Claude settings environment. The daily update check is kept by the operator's word."
