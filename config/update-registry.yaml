  codegraph:
    tier: notify
    display: CodeGraph (npm)
    telemetry:
      kind: switch
      probe: |-
        /usr/bin/python3 -I - <<'PY'
        import json, os, subprocess
        from pathlib import Path
        def systemd_env():
            out = subprocess.run(["/usr/bin/systemctl", "--user", "show-environment"],
                                 capture_output=True, text=True, timeout=10, check=True).stdout
            return dict(line.split("=", 1) for line in out.splitlines() if "=" in line)
        def settings_env(path):
            try:
                with open(path, encoding="utf-8") as fh:
                    env = json.load(fh).get("env")
            except FileNotFoundError:
                return {}
            if env is not None and not isinstance(env, dict):
                raise SystemExit(f"{path}: env is not a mapping")
            return env or {}
        def sources():
            caller = dict(os.environ)
            return {"caller": caller, "timer": systemd_env(),
                    "claude-settings": {**caller, **settings_env(Path.home() / ".claude/settings.json")}}
        with open(Path.home() / ".codegraph/telemetry.json", encoding="utf-8") as fh:
            doc = json.load(fh)
        config_off = isinstance(doc, dict) and doc.get("enabled") is False
        bad = []
        for name, env in sources().items():
            if env.get("DO_NOT_TRACK", "").strip().lower() in ("1", "true", "yes"):
                continue
            if "CODEGRAPH_TELEMETRY" in env:
                if env["CODEGRAPH_TELEMETRY"].strip().lower() not in ("0", "false", "off", "no"):
                    bad.append(f"{name} CODEGRAPH_TELEMETRY={env['CODEGRAPH_TELEMETRY']!r}")
                continue
            if not config_off:
                bad.append(f"{name} telemetry.json not enabled=false")
        print("effective=on: " + ", ".join(bad) if bad else "effective=off")
        PY
