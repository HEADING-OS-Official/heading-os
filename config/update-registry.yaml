# Update-manager component registry. Loaded by scripts/update-manager.py.
# Tiers: auto (timer applies), notify (checked, applied by one command),
# observed (read-only version surface; component owns its own updater).
# Invariant: an `observed` entry may not carry an `apply` (enforced by
# scripts/utils/update_registry.py).
#
# Scope, the operator's words of 2026-09-26: translated: "Let the update manager
# watch everything except what is on Windows. Strike Ollama from tracking." and
# "Leave the programs on the Windows side alone. I do that myself." So every
# tool this workspace runs on the Linux side is listed, nothing on the Windows
# side is, and Ollama is not tracked at all (it runs as a Windows app; the Linux
# probe answered "not answered" every day because no Linux binary exists).
#
# Tier rules for the entries added under HOS-143 (HELM's brief, 2026-09-26):
# nothing new is `auto` unless it is a user-space tool with no service
# depending on it AND its updater verifies a checksum, and none added here
# meets both, so none is `auto`. A binary a live service runs (lific, herdr)
# carries no `apply` at all: replacing it changes a running process, which is
# HELM's by hand. apt and snap need sudo, so they are watched only.
# Hindsight is `auto` by the operator's decision of 2026-11-13 although a live
# service depends on it, because each updater verifies what it installs, rolls
# back code on its own before any database change, and after a migration
# failure stops the server and notifies instead of guessing; the database is
# never restored automatically.
#
# Paths are spelled out under $HOME because the timer runs under systemd with a
# minimal PATH, and npm/node probes load nvm themselves for the same reason; a
# fresh login shell resolves the same default the probe does.
#
# Telemetry: every component carries a `telemetry:` entry (kind `none` with the
# evidence read, `switch` with a read-only `probe` and the `off` regex its output
# matches, or `unknown` with what was looked at), because of the operator's rule
# M056 in his private policy: telemetry is always off, update checks are allowed.
# `apply` refuses a component not verified off, and every new component needs a
# verified entry; the loader refuses one without it (HOS-412).
components:

  cliproxyapi:
    # `auto` since 2026-09-20, on the operator's instruction: he asked for the
    # upgrade to stop needing him. `notify` is what made it need him, because
    # `notify` means "tell him and wait", so 7.3.9 sat unapplied.
    #
    # Safe at this tier because the apply script rolls back on its own, and that
    # was READ rather than assumed: it verifies a sha256 against the published
    # checksums and refuses an unverified swap, backs up the running binary,
    # swaps atomically, restarts the unit, waits up to 30s for the health probe,
    # and restores the backup when the probe does not answer HTTP 200. Its exit
    # codes keep "could not fetch" and "checksum mismatch" apart from a real
    # rollback, because neither of those swapped anything.
    #
    # That matters here more than for the other components: the operator's rule
    # is that this proxy is always running, so an unattended update is only
    # allowed while a bad one puts the working binary back without him.
    tier: auto
    display: CLIProxyAPI
    telemetry:
      kind: switch
      probe: |-
        /usr/bin/python3 -I - <<'PY'
        from pathlib import Path
        import yaml
        with open(Path.home() / "cliproxyapi/config.yaml", encoding="utf-8") as fh:
            doc = yaml.safe_load(fh)
        if not isinstance(doc, dict):
            raise SystemExit("config.yaml is not a mapping")
        print("effective=on: a top-level home key is configured" if "home" in doc else "effective=off")
        PY
      "off": "^effective=off$"
      evidence: "sweep report 2026-11-22-1720_no-telemetry-sweep (registry name deliverables), sweep-findings.md section 8: version lookups and the panel download only, update checks the operator keeps (HOS-412). The binary also carries a Home client that sends latency telemetry to a configured `home:` server (strings 'Home latency telemetry failed', 'Home subscription telemetry PING', read 2026-11-23). The probe parses config.yaml as YAML, so a quoted key counts; off while no top-level home key exists."
    current:
      via: shell
      cmd: "$HOME/cliproxyapi/cli-proxy-api -version 2>&1 | head -5"
      regex: 'Version:\s*([0-9.]+)'
    latest:
      via: github_release
      repo: router-for-me/CLIProxyAPI
    apply:
      script: scripts/updaters/cliproxyapi_update.py
    health:
      cmd: "$HOME/.local/bin/cliproxy health"
      expect_substr: "HTTP 200"

  yt-dlp:
    # Every command spelled under $HOME, per the header. Until 2026-10-01 these
    # four were bare names, and MEASURED that day under the timer's PATH
    # (/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:...) both
    # `yt-dlp` and `uv` were "command not found": the probe gave nothing, so
    # the component read `unknown` every morning and was never auto-updated.
    tier: auto
    display: yt-dlp
    telemetry:
      kind: none
      evidence: "Source read 2026-11-23: a grep of the installed yt_dlp package for telemetry, analytics, posthog, sentry and mixpanel finds only extractor URL patterns for sites' own analytics hosts, no reporting code."
    current:
      via: shell
      cmd: "$HOME/.local/bin/yt-dlp --version"
    latest:
      via: pypi
      package: yt-dlp
    apply:
      cmd: "$HOME/.local/bin/uv tool upgrade yt-dlp"
      # {prev} is substituted with the version captured before the upgrade, so a
      # health failure restores it (auto-never-broken invariant).
      rollback_cmd: "$HOME/.local/bin/uv tool install 'yt-dlp=={prev}'"
    health:
      cmd: "$HOME/.local/bin/yt-dlp --version"

  claude-cli:
    # Under $HOME for the yt-dlp reason above: a bare `claude` is not on the
    # timer's PATH (MEASURED 2026-10-01).
    tier: observed
    display: Claude Code CLI
    telemetry:
      kind: switch
      probe: |-
        /usr/bin/python3 -I - <<'PY'
        import json, os, subprocess
        from pathlib import Path
        def systemd_env():
            out = subprocess.run(["/usr/bin/systemctl", "--user", "show-environment"],
                                 capture_output=True, text=True, timeout=10, check=True).stdout
            return dict(line.split("=", 1) for line in out.splitlines() if "=" in line)
        def settings_env(path):
            try:
                with open(path, encoding="utf-8") as fh:
                    env = json.load(fh).get("env")
            except FileNotFoundError:
                return {}
            if env is not None and not isinstance(env, dict):
                raise SystemExit(f"{path}: env is not a mapping")
            return env or {}
        def sources():
            caller = dict(os.environ)
            return {"caller": caller, "timer": systemd_env(),
                    "claude-settings": {**caller, **settings_env(Path.home() / ".claude/settings.json")}}
        KEYS = ("DISABLE_TELEMETRY", "DISABLE_ERROR_REPORTING", "DISABLE_BUG_COMMAND",
                "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC")
        session = dict(os.environ)
        for p in (Path.home() / ".claude/settings.json", Path(".claude/settings.json"),
                  Path(".claude/settings.local.json"), Path("/etc/claude-code/managed-settings.json")):
            session.update(settings_env(p))
        timer = systemd_env()
        bad = [f"session {k}={session.get(k)!r}" for k in KEYS
               if str(session.get(k, "")).strip().lower() not in ("1", "true")]
        bad += [f"timer {k}={timer.get(k)!r}" for k in KEYS
                if timer.get(k, "").strip().lower() not in ("1", "true")]
        print("effective=on: " + ", ".join(bad) if bad else "effective=off")
        PY
      "off": "^effective=off$"
      evidence: "sweep report 2026-11-22-1720_no-telemetry-sweep (registry name deliverables), sweep-findings.md section 1: telemetry, error reporting and nonessential traffic stop with the four switches. The probe merges the settings files in Claude Code's order (user, this checkout's project and local settings, managed settings last) over the caller's environment, and reads the systemd user environment the timers inherit; all four must be 1 in both. A session started in another project directory, or from a shell environment other than the caller's, is not covered."
    current:
      via: shell
      cmd: "$HOME/.local/bin/claude --version 2>/dev/null"
      regex: '([0-9]+\.[0-9]+\.[0-9]+)'
    latest:
      via: npm
      package: "@anthropic-ai/claude-code"

  lific:
    # The issue tracker's binary; lific.service runs it. Watched only: an
    # update replaces a running daemon's binary, which is HELM's by hand.
    tier: observed
    display: Lific
    telemetry:
      kind: none
      evidence: "Strings of ~/.local/bin/lific read 2026-11-23: the one 'telemetry' match is the LSP protocol method name telemetry/event in its bundled editor code, no reporting endpoint; it listens on 127.0.0.1:3456 only (sweep section 1)."
    current:
