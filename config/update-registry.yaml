            doc = json.load(fh)
        if not isinstance(doc, dict):
            raise SystemExit("settings.json is not an object")
        value = doc.get("telemetry")
        print("effective=off" if value is False else f"effective=on: settings telemetry={value!r}")
        PY
      "off": "^effective=off$"
      evidence: "~/.config/herdr-app/AGENTS.md lines 819-826 (read 2026-11-23): the app sends a daily usage report, on when absent; settings.json \"telemetry\": false stops it; DO_NOT_TRACK=1 or HERDR_TELEMETRY=0 only turn it off for one run, nothing there turns it on. The probe parses the JSON, so a later duplicate key wins as it does for the app. The TUI binary carries no telemetry string (read 2026-11-23); its update check is kept by the operator's word."
    current:
