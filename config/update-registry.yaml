            unit_pats = ("^Environment=", "^EnvironmentFile=")
            return SEMI.join([block(f"unit {UNIT}", unit_pats, f"/etc/systemd/system/{UNIT}.service"),
                              block(f"dropin {UNIT}", unit_pats, f"/etc/systemd/system/{UNIT}.service.d/*.conf"),
                              block(f"file {CPENV}", ("^NEXT_TELEMETRY_DISABLED=",), CPENV),
                              "/usr/bin/true"])
        def fetch():
            res = subprocess.run(["/usr/bin/ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=10", host(), remote()],
                                 capture_output=True, text=True, errors="replace", timeout=25, check=False)
            if res.returncode != 0:
                raise SystemExit(3)
            return res.stdout
        def sections(text):
            out, cur = [], None
            for line in text.splitlines():
                if line.startswith("### rc "):
                    if cur is None:
                        raise SystemExit(3)
                    cur[2] = int(line[7:].strip())
                    out.append(cur)
                    cur = None
                elif line.startswith("### "):
                    kind, _, name = line[4:].partition(" ")
                    cur = [kind, name, None, []]
                elif cur is not None:
                    cur[3].append(line)
            return out
        def unquote(v):
            v = v.strip()
            if len(v) >= 2 and v[0] == v[-1] and v[0] in ("'", '"'):
                v = v[1:-1]
            return v
        def verdict(text):
            got = {}
            for kind, name, rc, lines in sections(text):
                got[(kind, name)] = (rc, lines)
            for key in (("unit", UNIT), ("dropin", UNIT), ("file", CPENV)):
                if key not in got:
                    raise SystemExit(3)
            rc, lines = got[("unit", UNIT)]
            if rc == 2:
                raise SystemExit(3)
            lines = (lines if rc == 0 else []) + (got[("dropin", UNIT)][1] if got[("dropin", UNIT)][0] == 0 else [])
            env, envfiles = {}, []
            for line in lines:
                key, _, val = line.partition("=")
                if key == "Environment":
                    if not val.strip():
                        env = {}
                    for pair in shlex.split(val):
                        k, eq, v = pair.partition("=")
                        if eq:
                            env[k] = v
                elif key == "EnvironmentFile":
                    val = unquote(val)
                    if not val:
                        envfiles = []
                        continue
                    optional = val.startswith("-")
                    envfiles.append((val[1:] if optional else val, optional))
            listed = [o for p, o in envfiles if p == CPENV]
            if got[("file", CPENV)][0] == 2 and not (listed and all(listed)):
                raise SystemExit(3)
            if not any(path == CPENV for path, _ in envfiles):
                print("effective=on: cp.env not loaded")
                return
            for path, optional in envfiles:
                if path != CPENV:
                    print(f"effective=on: unit {UNIT} loads unchecked file {path}")
                    return
                frc, flines = got[("file", CPENV)]
                if frc == 2:
                    if not optional:
                        raise SystemExit(3)
                    continue
                for line in flines:
                    kv = env_line(line)
                    if kv:
                        env[kv[0]] = kv[1]
            if "NEXT_TELEMETRY_DISABLED" not in env:
                print("effective=on: NEXT_TELEMETRY_DISABLED not set")
                return
            if unquote(env["NEXT_TELEMETRY_DISABLED"]).lower() not in ("1", "true"):
                print("effective=on: NEXT_TELEMETRY_DISABLED is not 1 or true")
                return
            print("effective=off")
        verdict(fetch())
        PY
      "off": "^effective=off$"
      evidence: "read by HELM 2026-11-23 on the memory host, unit hindsight-cp, /opt/hindsight-cp/1.2.3/package (Next.js standalone, bin/cli.js): its only telemetry channel is Next.js telemetry (standalone/node_modules/next/dist/telemetry), and /etc/hindsight/cp.env, loaded by the unit's EnvironmentFile line, sets NEXT_TELEMETRY_DISABLED=1. The bundle's 'amplitude' hits are the SVG attribute, not the analytics SDK. Live: no outbound TCP connection. The probe reads, over the HINDSIGHT_ADMIN_SSH_HOST alias, the unit's Environment and EnvironmentFile lines and the one key in cp.env; off only when cp.env is loaded and the effective value is 1 or true."
    current:
      via: script
      script: scripts/updaters/hindsight_console_update.py
      args: ["--print-current"]
    latest:
      via: npm
      package: "@vectorize-io/hindsight-control-plane"
    apply:
      script: scripts/updaters/hindsight_console_update.py
      timeout_s: 1500

  hindsight-cli:
    # The release binary in ~/.local/bin. `auto` since 2026-11-13 by the
    # operator's decision that Hindsight updates itself.
    #
    # scripts/updaters/hindsight_cli_update.py waits until the server reports
    # the same version, downloads the release asset over https and refuses it
    # unless its sha256 equals the digest in the GitHub release API, keeps the
    # running binary under a dated backup name and installs by an atomic
    # rename. Safe because the new binary must print its version and reach
    # the server, and otherwise the kept binary is put back and the operator
    # is notified.
    tier: auto
    display: Hindsight CLI
    telemetry:
      kind: none
      evidence: "sweep report 2026-11-22-1720_no-telemetry-sweep (registry name deliverables), sweep-findings.md section 4: no vendor or analytics URL among the binary's strings; it talks only to the configured server."
    current:
      via: shell
      cmd: "$HOME/.local/bin/hindsight --version"
      regex: 'hindsight (\S+)'
    latest:
      via: github_release
      repo: vectorize-io/hindsight
    apply:
      script: scripts/updaters/hindsight_cli_update.py

  hindsight-coding-agents:
    # The Claude Code plugin behind the memory banner, versioned on its own.
    # Current is its own package.json. `auto` since 2026-11-13 by the
    # operator's decision that Hindsight updates itself.
    #
    # scripts/updaters/hindsight_plugin_update.py packs the npm release into
    # scratch and refuses it unless its sha512 equals the registry's
    # `dist.integrity`; a release that changes hooks/hooks.json is refused and
    # reported, because a new hook set needs a human look. Otherwise the
    # installed directory and the skill file are kept under dated backup
    # names, the package replaces them, the install origin is carried over and
    # ~/.hindsight/coding-agent.json is never touched. Safe because every hook
    # script must pass `node --check`, and otherwise the backups are put back
    # and the operator is notified.
    tier: auto
    display: Hindsight coding-agents plugin
    telemetry:
      kind: none
      evidence: "sweep report 2026-11-22-1720_no-telemetry-sweep (registry name deliverables), sweep-findings.md section 4: no analytics library or string in dist; it talks only to the configured apiUrl, and autoUpdate is false."
    current:
      via: shell
      cmd: "cat $HOME/.hindsight/coding-agents/package.json"
      regex: '"version":\s*"([^"]+)"'
    latest:
      via: npm
      package: "@vectorize-io/hindsight-coding-agents"
    apply:
      script: scripts/updaters/hindsight_plugin_update.py

