  hindsight-server:
    # The Hindsight memory server. `auto` since 2026-11-13: the operator decided
    # that day that Hindsight updates itself, server included, rather than
    # being upgraded on its host by hand. The version is still asked of the
    # server through its own CLI over the tunnel.
    #
    # scripts/updaters/hindsight_server_update.py runs, over the root ssh alias
    # in `.env` HINDSIGHT_ADMIN_SSH_HOST, the steps of the two manual upgrades
    # that ran clean (2026-10-23 and 2026-11-13): the tag's commit is resolved
    # through the GitHub API and the clone refused unless HEAD equals it; the
    # new tree is built beside the running one while the services keep
    # running; the services are stopped only within 600 s of the start and
    # never during a laptop sync pass; a pgBackRest diff backup is taken with
    # nothing writing, and a failed backup starts the old services again; the
    # migration runs with the new tree. Safe because every failure before the
    # migration leaves or puts the old version running, and a failure at or
    # after the migration stops both services and notifies the operator with
    # the backup label instead of starting old code on a migrated schema; the
    # database is never restored automatically. `timeout_s` 3000 covers the
    # 600 s cutoff, every per-call limit after the stop (2021 s) and the
    # notification with a margin; the script re-checks that sum right before
    # the stop and answers "not now" when it does not fit. The script is its
    # own health gate.
    tier: observed
    display: Hindsight server
    telemetry:
      kind: switch
      probe: |-
        /usr/bin/python3 -I - <<'PY'
        import os, re, shlex, subprocess
        from pathlib import Path
        SEMI = " " + chr(59) + " "
        UNITS = ("hindsight-api", "hindsight-worker")
        FILES = ("/etc/hindsight/runtime.env", "/etc/hindsight/secrets.env")
        KEYS = ("HINDSIGHT_API_OTEL_TRACES_ENABLED", "HINDSIGHT_API_OTEL_EXPORTER_OTLP_ENDPOINT", "HF_HUB_DISABLE_TELEMETRY")
        NAME = re.compile(r"[A-Za-z_][A-Za-z0-9_]*")
        def env_line(line):
            line = line.strip()
            if not line or line.startswith("#") or "=" not in line:
                return None
            key, value = line.split("=", 1)
            key = key.strip()
            if key[:6] == "export" and key[6:7] in (" ", "\t"):
                key = key[6:].strip()
            if not NAME.fullmatch(key):
                return None
            value = value.strip()
            if len(value) >= 2 and value[0] == value[-1] and value[0] in ("'", '"'):
                value = value[1:-1]
            return key, value
        def host():
            h = os.environ.get("HINDSIGHT_ADMIN_SSH_HOST") or ""
            if not h:
                try:
                    lines = Path(".env").read_text(encoding="utf-8").splitlines()
                except FileNotFoundError:
                    lines = []
                for line in lines:
                    kv = env_line(line)
                    if kv and kv[0] == "HINDSIGHT_ADMIN_SSH_HOST":
                        h = kv[1]
                        break
            if not h or h.startswith("-") or any(c.isspace() for c in h):
                raise SystemExit(2)
            return h
        def block(tag, pats, paths):
            grep = "/usr/bin/grep -h " + " ".join("-e " + shlex.quote(p) for p in pats) + " " + paths
            return SEMI.join([f"/usr/bin/echo '### {tag}'", grep, '/usr/bin/echo "### rc $?"'])
        def remote():
            unit_pats = ("^Environment=", "^EnvironmentFile=")
            parts = [block(f"unit {u}", unit_pats, f"/etc/systemd/system/{u}.service") for u in UNITS]
            parts += [block(f"dropin {u}", unit_pats, f"/etc/systemd/system/{u}.service.d/*.conf") for u in UNITS]
            parts += [block(f"file {f}", tuple(f"^{k}=" for k in KEYS), f) for f in FILES]
            parts.append("/usr/bin/true")
            return SEMI.join(parts)
        def fetch():
            res = subprocess.run(["/usr/bin/ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=10", host(), remote()],
                                 capture_output=True, text=True, errors="replace", timeout=25, check=False)
            if res.returncode != 0:
                raise SystemExit(3)
            return res.stdout
        def sections(text):
            out, cur = [], None
            for line in text.splitlines():
                if line.startswith("### rc "):
                    if cur is None:
                        raise SystemExit(3)
                    cur[2] = int(line[7:].strip())
                    out.append(cur)
                    cur = None
                elif line.startswith("### "):
                    kind, _, name = line[4:].partition(" ")
                    cur = [kind, name, None, []]
                elif cur is not None:
                    cur[3].append(line)
            return out
        def unquote(v):
            v = v.strip()
            if len(v) >= 2 and v[0] == v[-1] and v[0] in ("'", '"'):
                v = v[1:-1]
            return v
        def verdict(text):
            secs = sections(text)
            units = {u: [] for u in UNITS}
            files = {}
            seen = set()
            for kind, name, rc, lines in secs:
                seen.add((kind, name))
                if kind in ("unit", "dropin") and name in units:
                    if rc == 2 and kind == "unit":
                        raise SystemExit(3)
                    units[name] += lines if rc == 0 else []
                elif kind == "file":
                    files[name] = (rc, lines)
            for u in UNITS:
                if ("unit", u) not in seen or ("dropin", u) not in seen:
                    raise SystemExit(3)
            for f in FILES:
                if f not in files:
                    raise SystemExit(3)
            plan = {}
            for u, lines in units.items():
                env, envfiles = {}, []
                for line in lines:
                    key, _, val = line.partition("=")
                    if key == "Environment":
                        if not val.strip():
                            env = {}
                        for pair in shlex.split(val):
                            k, eq, v = pair.partition("=")
                            if eq:
                                env[k] = v
                    elif key == "EnvironmentFile":
                        val = unquote(val)
                        if not val:
                            envfiles = []
                            continue
                        optional = val.startswith("-")
                        envfiles.append((val[1:] if optional else val, optional))
                plan[u] = (env, envfiles)
            for f in FILES:
                if files[f][0] == 2 and not all(any(p == f and o for p, o in fl) for _, fl in plan.values()):
                    raise SystemExit(3)
            for u, (env, envfiles) in plan.items():
                for path, optional in envfiles:
                    if path not in FILES:
                        print(f"effective=on: unit {u} loads unchecked file {path}")
                        return
                    rc, lines = files[path]
                    if rc == 2:
                        if not optional:
                            raise SystemExit(3)
                        continue
                    for line in lines:
                        kv = env_line(line)
                        if kv:
                            env[kv[0]] = kv[1]
                if env.get("HINDSIGHT_API_OTEL_TRACES_ENABLED", "").lower() in ("true", "1", "yes"):
                    print(f"effective=on: unit {u} HINDSIGHT_API_OTEL_TRACES_ENABLED")
                    return
                if env.get("HF_HUB_DISABLE_TELEMETRY") != "1":
                    print(f"effective=on: unit {u} HF_HUB_DISABLE_TELEMETRY")
                    return
            print("effective=off")
        verdict(fetch())
        PY
      "off": "^effective=off$"
      evidence: "read by HELM 2026-11-23 on the memory host, /opt/hindsight/v1.2.3: hindsight_api has no posthog, sentry or segment client; its only such channel is OpenTelemetry tracing, DEFAULT_OTEL_TRACES_ENABLED = False (hindsight_api/config.py:2432), parsed as .lower() in ('true', '1', 'yes') (config.py:6261-6262), and the tracer does not start without an endpoint (tracing.py:276). Neither HINDSIGHT_API_OTEL_TRACES_ENABLED nor the OTLP endpoint is set in /etc/hindsight/runtime.env or secrets.env; the units set HF_HUB_OFFLINE=1, TRANSFORMERS_OFFLINE=1 and HF_HUB_DISABLE_TELEMETRY=1. sentry_sdk is present only as a dependency of litellm and fastapi-cloud-cli and nothing calls sentry_sdk.init; litellm 1.104.0 has no telemetry flag. Live TCP went only to 127.0.0.1:5432 and 127.0.0.1:8317. The probe reads, over the HINDSIGHT_ADMIN_SSH_HOST alias, only the Environment and EnvironmentFile lines of hindsight-api and hindsight-worker and the three keys in the two env files, applies them in systemd's order, and keeps only whether the endpoint is set."
