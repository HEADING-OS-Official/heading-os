# Operator identity - EXAMPLE / TEMPLATE
# =======================================
# Who runs this HEADING OS instance. The engine ships this generic example so a
# fresh public clone resolves to a neutral "operator" with no personal defaults.
#
# This is the engine-shipped EXAMPLE. The real file is private per-instance DATA:
# copy it into your data overlay as operator.yaml in the directory
# get_data_config_dir() resolves (logical name `data-config`; print it with
# `python scripts/data-path.py path data-config`)
# and fill in your own values. That file is gitignored / routed private and never
# ships in the engine.
#
# Resolution precedence (highest wins), see scripts/utils/operator_identity.py:
#   1. environment  HEADING_OS_OPERATOR_{NAME,SLUG,GITHUB_ORG,VOICE_REFERENCE,EMAIL,
#                   CORPORATE_EMAIL_DOMAIN,ADMIN_EMAIL}
#   2. data overlay operator.yaml under `data-config`
#   3. an operator.yaml in the engine clone's own config directory (gitignored; for a data-less clone)
#   4. this shipped example, whose empty values fall through to the neutral
#      defaults `_GENERIC` in scripts/utils/operator_identity.py holds

# Display name. Empty means the neutral default "Operator".
name: ""

# Short kebab-case handle used for per-instance paths and identity. Empty means
# the neutral default "operator".
slug: ""

# GitHub org / owner that hosts your private data repo.
# Leave empty on a fresh clone; set it when you create your repos.
github_org: ""

# The registry name of your voice reference file (HOS-234), resolved by
# `voice_reference_path()`. A path here is still read, as relative to the data
# root, and said on stderr as deprecated. Empty means the default "voice-guide".
voice_reference: ""

# Operator email used in generated correspondence.
email: ""

# Your organisation's CORPORATE mail domain, BARE and with no "@". Not the
# domain half of `email` above: the two are routinely
# different, and this one is the company's, not yours. It decides which mail
# threads count as internal and which CRM contacts hold a company mailbox
# without being typed as team. Leave empty and both checks stay silent, which
# is the correct behaviour for a clone that has no corporate domain.
corporate_email_domain: ""

# The inbox that reaches whoever ADMINISTERS this instance. A whole address, not
# a domain. It may differ from `email` above, which is whoever runs this clone.
#
# Read by a team bot's backup email, which offers it as "reach a human".
# Leave it empty and it falls back to `email`, then refuses rather than send to
# nobody.
admin_email: ""

# Your company in one phrase, e.g. "Acme Ltd, a logistics software company".
# Read into the prompts that triage mail, label memory documents and classify
# past sessions. Empty means they speak of "the operator's company".
company: ""

# The context block every council consult opens with: who you are, what the
# company does, the words it uses, the constraints an advisor must respect. A
# YAML block scalar (`advisor_context: |`) keeps it multi-line. Empty means a
# generic opening that asks for the context it needs.
advisor_context: ""

# The company as branded output prints it: the name ("Acme Ltd"), a short form
# for file names and CRM matching ("ACME"), and the site ("acme.example"). Empty
# means footers, cover lines and deck file names leave the company out.
company_name: ""
company_short: ""
company_site: ""
# The tagline a branded letterhead prints under the name. Empty means none.
company_tagline: ""
