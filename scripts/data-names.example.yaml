# Data-address names - THE ENGINE'S DEFAULT SET
# ============================================
# THIS FILE IS A DEFAULT AND IT IS NEVER THE LIVE REGISTRY. The live list is the
# `names:` block of `<data-root>/config/data-paths.yaml`, and a tree that has
# that block always wins: `scripts/utils/data_path.py` reads this file ONLY when
# the tree's registry carries no `names:` block at all. It is the exact twin of
# `scripts/runtime-services.example.yaml`, which stands in the same relation to
# the `services:` block, and `load_registry()` states the three cases the way
# `runtime_dir.load_services()` states its own.
#
# WHY THE ENGINE SHIPS ONE. Without it, every bare registry name refuses on any
# tree that has no registry of its own, and such trees are ordinary rather than
# hypothetical: a public clone with no data repository, and a data repository
# the moment `scripts/init-data.py` creates it: that script seeds the registry
# from the services template, which carries no `names:` block, so a data
# repository is born without one. Another is any fixture assembled by hand.
#
# WHAT IT MAY HOLD, and this line is the boundary rather than a preference. It
# carries STRUCTURE: the subject roots listed in `subject_roots:` below, and the
# generic sub-addresses inside them, which are the same in every workspace. It carries no
# real person, no real entity, no private path, no dated one-off directory and
# nothing else belonging to one operator. The engine repository is public. Two
# names the engine's own code asks for are deliberately absent for that reason
# and are named in `template_names()`.
#
# WHAT AN ENTRY IS. `what:` says in one line what the address holds. Exactly one
# of `path:` or `runtime:` is the base. `path:` is an address of its own,
# relative to the data root, and every one in this file sits inside the subject
# tree; `runtime: <service>/<kind>` defers to the service vocabulary, with
# `under:` naming the sub-address inside it. `{person}` and the like are
# parameters, supplied at the call.
#
# The `record: <family>/<leaf>` base is retired (HOS-240, 2026-10-13).
#
# Adding a name HERE registers nothing on a tree that has its own `names:`
# block; it changes what a tree without one is answered.

version: 1

# The runtime store's directory under the data root, where every
# `runtime:<service>/<kind>` address lands. A tree's own registry that declares
# this key wins; one that does not is answered from this line. Written plain and
# once, because the overlay write guard reads it with a regular expression
# (`scripts/utils/registry_bootstrap.py`) and the resolver refuses a registry the
# two would read differently. Moving the store is an edit of this one key in the
# tree's registry, and its `.gitignore` rules must move with it: the resolver
# refuses a relocated store whose ignore rules did not follow
# (`runtime_dir.store_ignore_problems`). The live registry moved it to
# `system/runtime` with the C3 structure (2026-10-13); the default here stays
# `runtime-junk` because the synthetic trees and the yard-containment guards
# are built against it, and moving it is one change across all of them.
runtime_store: runtime-junk

# The top-level directories of the data repository's subject tree. Every guard
# asking "is this a data root" reads this list through `families.subject_roots()`
# (HOS-234): a tree's own registry that lists the key wins, and one that does not,
# or a machine with no data root at all, is answered from this line, which is the
# fail-closed answer for a wall. One line, flow style, in column 0, once: the
# guards read it with a regular expression and the resolver refuses a registry
# the two would read differently. A root may not name a top-level engine entry.
subject_roots: [accounts, company, content, people, knowledge, personal, inbox, system, archive]

