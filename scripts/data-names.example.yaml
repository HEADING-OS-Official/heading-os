  # Added 2026-09-22, and it passes the boundary above for the same reason
  # `datastore-map` and `search-domains` do: it is one generic file under
  # the reference home, present by the same name in every workspace, holding a
  # catalogue of that workspace's own scripts and systems. The catalogue's
  # CONTENTS are the operator's; the address is structure. Without this entry
  # `scripts/workspace-health.py` cannot come off the seam at all, because the
  # name exists only in the operator's private registry and a public clone was
  # answered `UnknownDataPath`.
  workspace-overview:
    what: "the runtime catalogue of every script, reference file and system"
    path: system/reference/workspace-overview.md
