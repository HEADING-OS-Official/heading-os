  # Added 2026-09-25, HOS-5 section 7. Each of these was named in operators'
  # registries while its writer and readers spelled the address themselves,
  # `runtime:<service>/<kind>` plus a file name, so editing the entry moved the
  # CLI's answer and no file. The consumers now ask the name, and a tree with
  # no `names:` block has to be able to answer it, or they would refuse there.
  # Structure only: the service, the kind and a file name the engine's own code
  # writes, the same in every workspace. `memory-index` is the same case for
  # the index file inside `auto-memory`. Three are named by their DIRECTORY and
  # not by their file, because the file is a `.log`, a `.png` and a `.lock`,
  # which `test_the_shipped_default_registry_names_no_operator_address` refuses
  # in this public file; the code joins the file name, and an edit to the
  # directory's entry still moves the file.
